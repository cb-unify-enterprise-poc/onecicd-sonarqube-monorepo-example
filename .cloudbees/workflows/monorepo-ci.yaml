apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: monorepo-ci

# Manual dispatch only: the SonarQube URL is a run input, and the inputs context
# is only defined for workflow_dispatch runs.
on:
  workflow_dispatch:
    inputs:
      sonar-host-url:
        type: string
        description: URL of the centralized SonarQube server, for example https://sonar.example.com
        default: https://sonar.example.com

# One reusable call per component. The two jobs have no dependency on each
# other, so they run in parallel and are scanned independently.
jobs:
  api:
    uses: ./.cloudbees/workflows/sonar-plugin.yaml
    with:
      component-name: api
      working-directory: api
      component-type: java
      sonar-project-key: onecicd-sonarqube-monorepo-api
      sonar-host-url: ${{ inputs.sonar-host-url }}
    secrets: inherit
    vars: inherit

  ui:
    uses: ./.cloudbees/workflows/sonar-plugin.yaml
    with:
      component-name: ui
      working-directory: ui
      component-type: node
      sonar-project-key: onecicd-sonarqube-monorepo-ui
      sonar-host-url: ${{ inputs.sonar-host-url }}
    secrets: inherit
    vars: inherit
